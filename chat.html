<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Velora Chat</title>
<style>
body{
  margin:0;
  background:#0f1020;
  color:white;
  font-family:Arial;
}
header{
  background:#5b21b6;
  padding:15px;
  text-align:center;
  font-size:22px;
}
#rules{
  background:#1c1d3a;
  padding:12px;
  font-size:14px;
}
#chat{
  height:300px;
  margin:10px;
  padding:10px;
  background:#1a1b33;
  border-radius:10px;
  overflow-y:auto;
}
.msg-user{background:#312e81;padding:6px;margin:6px;border-radius:6px;}
.msg-bot{background:#4c1d95;padding:6px;margin:6px;border-radius:6px;}
.input{
  display:flex;
  margin:10px;
}
input{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
}
button{
  margin-left:8px;
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
}
</style>
</head>
<body>

<header>Velora – البوت</header>

<div id="rules">
  🔒 المستخدم: 21 رسالة بوت – 6 رسائل قروب – تنسيق يومي  
  👤 الضيف: 6 رسائل بوت – مشاهدة القروب فقط – بدون تنسيق
</div>

<div id="chat"></div>

<div class="input">
  <input id="text" placeholder="اكتب رسالتك">
  <button onclick="send()">إرسال</button>
</div>

<script>
const params=new URLSearchParams(location.search);
const type=params.get("type")||"guest";

let botLimit= type==="user"?21:6;
let groupLimit= type==="user"?6:0;
let botCount=0;

const chat=document.getElementById("chat");

function send(){
  const t=document.getElementById("text");
  if(!t.value)return;

  if(botCount>=botLimit){
    addBot("❌ انتهت رسائلك اليوم");
    return;
  }

  addUser(t.value);
  addBot("✅ تم استقبال الرسالة");
  botCount++;
  t.value="";
}

function addUser(msg){
  const p=document.createElement("div");
  p.className="msg-user";
  p.textContent="أنت: "+msg;
  chat.appendChild(p);
  chat.scrollTop=chat.scrollHeight;
}

function addBot(msg){
  const p=document.createElement("div");
  p.className="msg-bot";
  p.textContent="🤖 "+msg;
  chat.appendChild(p);
  chat.scrollTop=chat.scrollHeight;
}

addBot("مرحبًا بك في Velora");
</script>

</body>
</html>
