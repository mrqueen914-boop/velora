<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Velora - Login</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  font-family: sans-serif;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.box {
  width: 320px;
  background: #000;
  border-radius: 25px;
  padding: 30px;
  text-align: center;
}

h1 {
  color: #ffc0d9;
  margin-bottom: 10px;
}

p {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 30px;
}

button {
  width: 100%;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

.login {
  background: #ffc0d9;
  <script>
// ====== زر ضيف ======
document.getElementById("guestBtn")?.addEventListener("click", () => {
  localStorage.setItem("role", "guest");
  localStorage.setItem("bot_limit", 6);
  localStorage.setItem("group_send", "false");
  localStorage.setItem("group_limit", 0);
  localStorage.setItem("style_limit", 0);

  window.location.href = "chat.html";
});

// ====== زر تسجيل دخول (عادي) ======
document.getElementById("loginBtn")?.addEventListener("click", () => {
  localStorage.setItem("role", "user");
  localStorage.setItem("bot_limit", 21);
  localStorage.setItem("group_send", "true");
  localStorage.setItem("group_limit", 6);
  localStorage.setItem("style_limit", 1);

  window.location.href = "chat.html";
});

// ====== زر تسجيل عبر قوقل ======
function onGoogleLoginSuccess() {
  localStorage.setItem("role", "user");
  localStorage.setItem("bot_limit", 21);
  localStorage.setItem("group_send", "true");
  localStorage.setItem("group_limit", 6);
  localStorage.setItem("style_limit", 1);

  window.location.href = "chat.html";
}

// ====== داخل صفحة الشات ======
function canSendGroup() {
  return localStorage.getItem("group_send") === "true";
}

function sendBotMessage() {
  let limit = Number(localStorage.getItem("bot_limit"));

  if (limit <= 0) {
    alert("خلص عدد رسائل البوت 💔");
    return;
  }

  localStorage.setItem("bot_limit", limit - 1);
  // هنا كود إرسال رسالة البوت
}

function sendGroupMessage() {
  if (!canSendGroup()) {
    alert("القروب قراءة فقط للضيوف 👀");
    return;
  }

  let limit = Number(localStorage.getItem("group_limit"));

  if (limit <= 0) {
    alert("خلص عدد رسائل القروب 🛑");
    return;
  }

  localStorage.setItem("group_limit", limit - 1);
  // هنا كود إرسال رسالة القروب
}

function styleClothes() {
  let limit = Number(localStorage.getItem("style_limit"));

  if (limit <= 0) {
    alert("خلص تنسيق اليوم ✋");
    return;
  }

  localStorage.setItem("style_limit", limit - 1);
  // هنا كود الذكاء الاصطناعي للتنسيق
}
</script>
  color: black;
}

.signup {
  background: #1a1a1a;
  color: white;
}

.guest {
  background: transparent;
  color: #ffc0d9;
}
</style>
</head>

<body>

<div class="box">
  <h1>Velora</h1>
  <p>سجّلي دخولك وخلّي الذكاء ينسّقك ✨</p>

  <button class="login">تسجيل دخول</button>
  <button class="signup">إنشاء حساب</button>
  <button class="guest">الدخول كضيف</button>
</div>

</body>
</html>
<script>
  document.querySelector('.login').onclick = () => {
    localStorage.setItem("role", "user");
    window.location.href = "bot.html";
  };

  document.querySelector('.guest').onclick = () => {
    localStorage.setItem("role", "guest");
    window.location.href = "bot.html";
  };
</script>
