<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Velora</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8cdda, #1d2b64);
      color: white;
      text-align: center;
    }
    .box {
      margin-top: 40vh;
      transform: translateY(-50%);
    }
    h1 {
      font-size: 48px;
    }
    p {
      font-size: 18px;
      opacity: 0.9;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Velora 💖</h1>
    <p>قريبًا… شيء جميل جدًا</p>
    <button>ابدأ</button>
  </div>
</body>
</html>
